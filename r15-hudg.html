<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R15 HUD</title>
<link href="https://fonts.googleapis.com/css2?family=B612+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#040605;--fg:#39ff8f;--ln:#1c2a22}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'B612 Mono',ui-monospace,monospace;color:var(--fg);user-select:none;-webkit-tap-highlight-color:transparent}
#st{position:absolute;left:0;top:0;width:640px;height:300px;transform-origin:0 0;color:#39ff8f;font-size:16px}
#st .a{position:absolute}.lb{font-size:12px;opacity:.65}
.dg{display:inline-block;height:1em;overflow:hidden;vertical-align:top;line-height:1em}
.col{display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.col span{height:1em;line-height:1em;display:block}
.sg{width:22px;height:6px;margin-bottom:2px;border:1px solid currentColor;opacity:.3}.sg.on{background:currentColor;opacity:1}
.hb{height:3px;background:currentColor;margin-top:3px;transform-origin:0 0;width:110px}
#menu{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:6px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;max-width:60vw}
#menu button{font:inherit;font-size:12px;color:#39ff8f;background:#0a110d;border:1px solid #2a4a38;border-radius:6px;padding:6px 8px}
#menu button#gear{opacity:.6}#menu .p{display:none;flex-wrap:wrap;gap:6px}#menu.open .p{display:flex}
#start{position:fixed;inset:0;z-index:9;background:#040605;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px}
#start p{max-width:420px;font-size:13px;opacity:.8;line-height:1.6}#start button{font:inherit;font-size:20px;color:#04200e;background:#39ff8f;border:0;border-radius:8px;padding:12px 36px}
</style></head><body>
<div id="start"><h2>R15 HUD</h2>
<p>Mount the phone in landscape on the handlebar stay. With the bike upright and still, tap SET then ZERO. Settings are for when you are stopped.</p>
<button id="go">START</button><p id="err"></p></div>
<div id="menu"><button id="gear">SET</button><div class="p">
<button id="zero">ZERO</button><button id="flip">FLIP L/R</button><button id="comp">COMP: ON</button><button id="mu">MU 1.05</button><button id="hang">HANG 4.5°</button><button id="hold">HOLD 10S</button><button id="rst">RESET MAX</button><button id="rstb">RESET BEST</button><button id="fitb">FIT 85%</button></div></div>
<div id="st">
<svg class="a" width="640" height="300" viewBox="0 0 640 300" style="left:0;top:0"><g id="tk" stroke="currentColor"></g>
<path d="M220 150 A100 100 0 0 1 420 150" fill="none" stroke="currentColor" stroke-opacity=".4"/>
<polygon id="lim" points="0,0 -5,-9 5,-9" fill="#ff4a4a"/><polygon id="ptr" points="0,0 -6,-11 6,-11" fill="currentColor"/>
<g id="bst" stroke="#ffb000" stroke-width="2"><line id="xL"/><line id="xR"/></g>
<g id="hz" stroke="currentColor" stroke-width="2" fill="none"><line x1="150" y1="150" x2="290" y2="150"/><line x1="350" y1="150" x2="490" y2="150"/><line x1="280" y1="115" x2="360" y2="115" stroke-opacity=".5"/><line x1="280" y1="185" x2="360" y2="185" stroke-opacity=".5"/></g>
<g id="fpm" stroke="currentColor" stroke-width="2" fill="none"><circle r="8"/><line x1="-20" y1="0" x2="-8" y2="0"/><line x1="8" y1="0" x2="20" y2="0"/><line x1="0" y1="-8" x2="0" y2="-16"/></g>
<g id="d1"></g><g id="d2"></g></svg>
<div class="a" style="left:0;width:640px;top:8px;text-align:center">LIMIT <span id="lm"></span>° MARGIN <span id="mg"></span>°</div>
<div class="a lb" style="left:0;width:640px;top:28px;text-align:center"><span id="info"></span> <span id="gps">GPS --</span></div>
<div class="a" style="left:20px;top:46px"><div class="lb">MAX L</div><div style="font-size:28px"><span id="mL"></span>°</div><div class="hb" id="hL"></div></div>
<div class="a" style="left:20px;top:112px"><div class="lb">MAX R</div><div style="font-size:28px"><span id="mR"></span>°</div><div class="hb" id="hR"></div></div>
<div class="a lb" style="left:20px;top:176px">BEST L <span id="sL"></span>° R <span id="sR"></span>°</div>
<div class="a" style="left:270px;top:180px;width:100px;text-align:center;font-size:34px;border:1px solid currentColor;padding:2px 0"><span id="cur"></span>°</div>
<div class="a lb" style="left:98px;top:272px;width:90px;text-align:center">LAT G <span id="gy" style="font-size:14px;opacity:1"></span></div>
<div class="a lb" style="left:428px;top:272px;width:90px;text-align:center">LONG G <span id="gx" style="font-size:14px;opacity:1"></span></div>
<div class="a" style="left:566px;top:46px"><div style="display:flex;gap:8px;font-size:12px;opacity:.65"><span style="width:22px">F</span><span style="width:22px">R</span></div>
<div style="display:flex;gap:8px;margin-top:4px"><div id="bF" style="display:flex;flex-direction:column"></div><div id="bR" style="display:flex;flex-direction:column"></div></div>
<div style="display:flex;gap:8px;font-size:11px;margin-top:2px"><div style="width:30px"><span id="pf"></span></div><div style="width:30px"><span id="pr"></span></div></div></div>
</div>
<script>
const $=i=>document.getElementById(i),NS='http://www.w3.org/2000/svg',st=$('st');
let FIT=.85;function fit(){const H=innerHeight*FIT,s=Math.min(innerWidth/640,H/300);st.style.transform='translate('+((innerWidth-640*s)/2)+'px,'+((H-300*s)/2)+'px) scale('+s+')'}fit();addEventListener('resize',fit);
function roll(el,t){if(el.dataset.n!=t.length){el.innerHTML='';el.dataset.n=t.length;for(const c of t){const d=document.createElement('span');if(/\d/.test(c)){d.className='dg';const k=document.createElement('span');k.className='col';k.innerHTML='0123456789'.split('').map(n=>'<span>'+n+'</span>').join('');d.appendChild(k)}else d.textContent=c;el.appendChild(d)}}
[...el.children].forEach((d,i)=>{const c=t[i];if(d.className=='dg')d.firstChild.style.transform='translateY(-'+(+c)+'em)';else d.textContent=c})}
const ln=(p,a)=>{const e=document.createElementNS(NS,'line');for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const CX=320,CY=150,R=100,rad=a=>a*Math.PI/180;
for(let a=-60;a<=60;a+=5){const M=a%30==0,m=a%10==0,l=M?16:m?10:5;ln($('tk'),{x1:CX+R*Math.sin(rad(a)),y1:CY-R*Math.cos(rad(a)),x2:CX+(R+l)*Math.sin(rad(a)),y2:CY-(R+l)*Math.cos(rad(a)),'stroke-width':M?2.5:1.2})}
function dial(g,cx,cy,r,min,max){const mk=v=>-120+(v-min)/(max-min)*240;
for(let v=min;v<=max+1e-6;v+=(max-min)/12){const a=rad(mk(v)),M=Math.round((v-min)/((max-min)/12))%3==0;ln(g,{x1:cx+r*Math.sin(a),y1:cy-r*Math.cos(a),x2:cx+(r-(M?9:5))*Math.sin(a),y2:cy-(r-(M?9:5))*Math.cos(a),stroke:'currentColor','stroke-width':M?2:1})}
const c=document.createElementNS(NS,'circle');c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r+3);c.setAttribute('fill','none');c.setAttribute('stroke','currentColor');c.setAttribute('stroke-opacity','.4');g.appendChild(c);
const n=ln(g,{x1:cx,y1:cy,x2:cx,y2:cy-r+6,stroke:'currentColor','stroke-width':2.5});return v=>{const a=Math.max(-125,Math.min(125,mk(v)));n.setAttribute('transform','rotate('+a+' '+cx+' '+cy+')')}}
const dLat=dial($('d1'),143,228,40,-1.2,1.2),dLon=dial($('d2'),477,228,40,-1,.6);
for(const id of['bF','bR'])for(let i=0;i<20;i++){const s=document.createElement('div');s.className='sg';$(id).appendChild(s)}
const P={mu:1.05,hang:4.5,hold:10,sign:1,comp:1,fs:.48,hl:.47,Ltan:1.325*Math.tan(rad(25.65))};
const S={u:[0,1,0],u0:null,w:[0,0,0],a:[0,0,0],v:null,lean:0,lat:0,lon:0,mL:0,mR:0,tL:0,tR:0,bL:0,bR:0,pf:0,pr:0,over:false,bl:0,run:false};
try{const b=JSON.parse(localStorage.getItem('r15best')||'{}');S.bL=b.L||0;S.bR=b.R||0}catch(e){}
const sv=()=>{try{localStorage.setItem('r15best',JSON.stringify({L:S.bL,R:S.bR}))}catch(e){}};
function onOri(e){if(e.beta==null)return;S.seen=1;const b=rad(e.beta),g=rad(e.gamma||0);S.u=[-Math.cos(b)*Math.sin(g),Math.sin(b),Math.cos(b)*Math.cos(g)];if(!S.u0)S.u0=S.u.slice()}
function onMot(e){const a=e.acceleration,r=e.rotationRate;if(a&&a.x!=null)S.a=[a.x,a.y,a.z];if(r&&r.alpha!=null)S.w=[rad(r.beta),rad(r.gamma),rad(r.alpha)]}
async function go(){try{
if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted')throw new Error('Motion sensors permission needed');if(DeviceMotionEvent.requestPermission)await DeviceMotionEvent.requestPermission()}
addEventListener('deviceorientation',onOri);addEventListener('devicemotion',onMot);
try{navigator.wakeLock&&await navigator.wakeLock.request('screen')}catch(e){}
if(navigator.geolocation)navigator.geolocation.watchPosition(p=>{S.v=p.coords.speed},()=>{S.v=null},{enableHighAccuracy:true,maximumAge:0});
$('start').style.display='none';S.run=true;try{const d=document.documentElement;if(d.requestFullscreen)await d.requestFullscreen({navigationUI:'hide'})}catch(e){}try{screen.orientation&&screen.orientation.lock&&await screen.orientation.lock('landscape')}catch(e){}setTimeout(()=>{if(!S.seen){$('start').style.display='flex';$('err').textContent='No sensor data. Open the https link in Chrome, not a downloaded file.'}},2500)}catch(e){$('err').textContent=e.message||'Sensors unavailable'}}
$('go').onclick=go;
$('gear').onclick=()=>$('menu').classList.toggle('open');
$('zero').onclick=()=>{S.u0=S.u.slice();S.mL=S.mR=0};
$('flip').onclick=()=>{P.sign*=-1};
$('comp').onclick=()=>{P.comp=P.comp==1?-1:P.comp==-1?0:1;$('comp').textContent='COMP: '+(P.comp==1?'ON':P.comp==-1?'INV':'OFF')};
$('mu').onclick=()=>{P.mu=P.mu>=1.3?.85:+(P.mu+.05).toFixed(2);$('mu').textContent='MU '+P.mu.toFixed(2)};
$('hang').onclick=()=>{P.hang=P.hang>=6?0:P.hang+1.5;$('hang').textContent='HANG '+P.hang+'°'};
$('hold').onclick=()=>{P.hold=P.hold==5?10:P.hold==10?30:5;$('hold').textContent='HOLD '+P.hold+'S'};
$('rst').onclick=()=>{S.mL=S.mR=0};$('rstb').onclick=()=>{S.bL=S.bR=0;sv()};$('fitb').onclick=()=>{FIT=FIT==1?.85:FIT==.85?.78:1;$('fitb').textContent='FIT '+Math.round(FIT*100)+'%';fit()};
const lp=(a,b,k)=>a+(b-a)*k,p2=n=>String(Math.round(n)).padStart(2,'0'),p3=n=>String(Math.min(999,Math.round(n))).padStart(3,'0');
function frame(){
const u=S.u,u0=S.u0||[0,1,0];
let raw=Math.atan2(u0[0]*u[1]-u0[1]*u[0],u0[0]*u[0]+u0[1]*u[1])*180/Math.PI*P.sign;
const v=S.v,w=S.w[0]*u[0]+S.w[1]*u[1]+S.w[2]*u[2];
let cor=0;if(P.comp&&v>3)cor=Math.max(-8,Math.min(8,P.Ltan*w/v*180/Math.PI))*P.comp*P.sign;
S.lean=lp(S.lean,raw-cor,.25);
const hn=Math.hypot(u[0],u[1])||1,lat=(S.a[0]*-u[1]+S.a[1]*u[0])/hn/9.81*P.sign,lon=-S.a[2]/9.81;
S.lat=lp(S.lat,lat,.2);S.lon=lp(S.lon,lon,.2);
const ay=Math.abs(S.lat),ax=S.lon,Ff=Math.max(.08,P.fs-P.hl*ax),Fr=Math.max(.08,1-P.fs+P.hl*ax);
const Lf=Math.hypot(ax<0?-ax:0,P.fs*ay)/(P.mu*Ff)*100,Lr=Math.hypot(ax>0?ax:0,(1-P.fs)*ay)/(P.mu*Fr)*100,L=Math.max(Lf,Lr);
const b=S.lean,a=Math.abs(b),now=Date.now(),lim=Math.round(Math.atan(P.mu)*180/Math.PI-P.hang);
if(S.run){if(b<0&&a>=S.mL){S.mL=a;S.tL=now}if(b>0&&a>=S.mR){S.mR=a;S.tR=now}
if(b<0&&a>S.bL){S.bL=a;sv()}if(b>0&&a>S.bR){S.bR=a;sv()}}
const fl=t=>Math.max(0,1-(now-t)/(P.hold*1000));
if(S.mL&&!fl(S.tL)){S.mL=b<0?a:0;S.tL=now}if(S.mR&&!fl(S.tR)){S.mR=b>0?a:0;S.tR=now}
const col=L>95?'#ff4a4a':L>85?'#ff9a2e':L>60?'#ffe14a':'#39ff8f';st.style.color=col;S.over=L>95;
const pos=(deg,len)=>[CX+len*Math.sin(rad(deg)),CY-len*Math.cos(rad(deg))];
$('ptr').setAttribute('transform','translate('+pos(b,R)+') rotate('+(180+b)+')');
$('lim').setAttribute('transform','translate('+pos(lim,R+18)+') rotate('+(180+lim)+')');
[['xL',-S.bL],['xR',S.bR]].forEach(([id,d])=>{const p1=pos(d,R-8),p2_=pos(d,R+18);const e=$(id);e.setAttribute('x1',p1[0]);e.setAttribute('y1',p1[1]);e.setAttribute('x2',p2_[0]);e.setAttribute('y2',p2_[1])});
$('hz').setAttribute('transform','rotate('+(-b)+' '+CX+' '+CY+')');
$('fpm').setAttribute('transform','translate('+(CX+S.lat*P.sign*40)+','+(CY-ax*50)+')');
dLat(S.lat);dLon(ax);
const n=v=>Math.round(Math.min(v,100)/5);
[['bF',Lf],['bR',Lr]].forEach(([id,v])=>[...$(id).children].forEach((s,i)=>s.classList.toggle('on',19-i<n(v))));
roll($('pf'),p3(Lf));roll($('pr'),p3(Lr));
roll($('cur'),p2(a));roll($('lm'),p2(lim));roll($('mg'),p2(Math.max(0,lim-a)));
roll($('mL'),p2(S.mL));roll($('mR'),p2(S.mR));roll($('sL'),p2(S.bL));roll($('sR'),p2(S.bR));
roll($('gy'),Math.abs(S.lat).toFixed(2));roll($('gx'),(ax<0?'-':'+')+Math.abs(ax).toFixed(2));
$('hL').style.transform='scaleX('+(S.mL?fl(S.tL):0)+')';$('hR').style.transform='scaleX('+(S.mR?fl(S.tR):0)+')';
$('info').textContent='MU '+P.mu.toFixed(2)+' / 208KG / HANG '+P.hang+'°';
$('gps').textContent=v==null?'GPS --':'GPS '+Math.round(v*3.6)+'KMH';
requestAnimationFrame(frame)}
setInterval(()=>{S.bl^=1;st.style.opacity=S.over&&S.bl?.35:1},320);
frame();
</script></body></html>
